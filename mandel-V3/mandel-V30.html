<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandelbrot V3 - DEM - Dev</title>
    <style>
      body {
        font-family: monospace;
        background: #121212;
        color: #eee;
        text-align: center;
        margin: 20px;
      }
      canvas {
        border: 2px solid #444;
        cursor: crosshair;
      }
      .controls {
        margin: 15px;
      }
      button {
        padding: 10px 20px;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #005999;
      }
      #status {
        margin-top: 10px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <h1>Mandelbrot Explorer (DEM & Modular Wasm)</h1>
    <canvas id="mandelCanvas"></canvas>

    <div class="controls">
      <button id="exportBtn">Copier l'orbite (Export Google Sheets)</button>
    </div>

    <div id="status">Chargement...</div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
