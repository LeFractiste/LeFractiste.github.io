<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandel-V4.5 - dev : Dual Explorer Mandelbrot / Julia</title>
    <title>Générateur SVG</title>
    <link rel="stylesheet" href="style-LeFractiste.css" />
    <style></style>
  </head>
  <body>
    <div class="workspace">
      <!-- Fenêtre Mandelbrot -->
      <div class="canvas-card">
        <h4>
          <span>Plan de Mandelbrot</span>
          <button id="btnResetMandel" style="font-size: 10px">Reset Zoom</button>
        </h4>
        <canvas id="mandelCanvas" width="500" height="500"></canvas>
        <div id="mandelStatus" class="info-bar">c = 0.000000 + 0.000000i</div>
      </div>

      <!-- Fenêtre Julia Soeur -->
      <div class="canvas-card">
        <h4>
          <span>Ensemble de Julia</span>
          <button id="btnResetJulia" style="font-size: 10px">Reset Zoom</button>
        </h4>
        <canvas id="juliaCanvas" width="500" height="500"></canvas>
        <div id="juliaStatus" class="info-bar">Target c = -0.700000 + 0.270150i</div>
      </div>
    </div>

    <!-- Panneau de Contrôle & Palette -->
    <!-- TODO 1: implémenter listbox selectCalcMode = [DEM, DIRECT] -->
    <div id="controls">
      <div id="paletteContainer"></div>
      <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center">
        <button
          id="btnTest"
          style="
            padding: 8px 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
        >
          Analyse orbite
        </button>
        <button
          id="btnCopyCsv"
          style="
            padding: 8px 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
        >
          📋 Copier l'orbite verrouillée (CSV)
        </button>
        <span id="appStatus" style="font-size: 12px; color: #4ade80">Page ok</span>
      </div>
    </div>
    <!-- module de code Applicatif -->
    <script type="module" src="./dist/app/app.js"></script>
  </body>
</html>
