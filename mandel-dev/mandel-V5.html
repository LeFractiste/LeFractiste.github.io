<!doctype html>
<!-- Copyright LeFractiste 2026 -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandel-V5 - dev : Dual Explorer Mandelbrot / Julia</title>
    <link rel="stylesheet" href="style-LeFractiste.css" />
    <style></style>
  </head>
  <body>
    <div class="workspace">
      <span id="appStatus" style="font-size: 12px; color: #10331d">Page ok</span>
      <!-- Mandel: main Mandelbrot plane -->
      <div class="canvas-card">
        <h4>
          <span>Plan de Mandelbrot</span>
          <button id="btnResetMandel" style="font-size: 11px">Reset</button>
        </h4>
        <canvas id="mandelCanvas" width="300" height="200"></canvas>
        <div id="mandelStatus" class="info-bar">c = 0.000000 + 0.000000i</div>
      </div>

      <!-- Julia: associated Julia set -->
      <div class="canvas-card">
        <h4>
          <span>Ensemble de Julia</span>
          <button id="btnResetJulia" style="font-size: 10px">Reset</button>
        </h4>
        <canvas id="juliaCanvas" width="300" height="200"></canvas>
        <div id="juliaStatus" class="info-bar">Target c = -0.700000 + 0.270150i</div>
      </div>
    </div>

    <!-- Control panel & Palette editor -->
    <!-- TODO 1: add UX : selectCalcMode = [DEM, DIRECT] & maxIter-->
    <div id="controls">
      <div id="paletteContainer"></div>
      <div style="margin-top: 10px; display: flex; gap: 10px; align-items: center">
        <button
          id="btnTest"
          style="
            padding: 8px 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
        >
          Analysis
        </button>
        <button
          id="btnCopyCsv"
          style="
            padding: 8px 15px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
          "
        >
          📋 Copier l'orbite verrouillée (CSV)
        </button>
      </div>
    </div>
    <!-- Application code -->
    <script type="module" src="./dist/app/appDev.js"></script>
  </body>
</html>
