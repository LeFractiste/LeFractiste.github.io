<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoonorama - Test de Projection Continuelle</title>
    <style>
      body {
        background-color: #121212;
        color: #eee;
        font-family: sans-serif;
        padding: 20px;
      }
      canvas {
        border: 1px solid #444;
        background: #000;
        display: block;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <h3>
      Zoonorama V1 - Test de projection continue - Zoom progressif le long de
      l'axe X
    </h3>
    <div id="statusBar">Ruban 1600x320</div>

    <canvas id="zoonoramaCanvas" width="1600" height="320"></canvas>

    <script type="module">
      import { ZonoramaProj, CalcMatrixDEM, distToImage } from "./proj.js";

      const canvas = document.getElementById("zoonoramaCanvas");
      const ctx = canvas.getContext("2d");

      // Point c d'intérêt (ex: pointe d'un minibrot ou spirale)
      const zMin = {
        re: -1.8, //-0.743643887037158704752191506114774,
        im: 0.0, // 0.131825904205311970493132056385139,
      };
      const zMax = { re: -1.6235942, im: 0.0 };
      const maxIter = 500;

      const L = 5; //test valeur extrême
      const H = Math.floor(1600.0 / L);
      let zoom = Math.exp(2 * L) - 2; //valeur approchée
      zoom = Math.exp((2 * L * (zoom - 1)) / (zoom + 1)); //valeur corrigée
      console.log("Zoom = " + Math.floor(zoom));

      let A = (2.0 * (zMax.re - zMin.re) * zoom) / (1 + zoom); //init square;
      const zCentreInit = { re: zMin.re + A * 0.5, im: zMin.im };

      console.time("Calcul Zoonorama");
      // 1. Matrice des coordonnées
      const z0Mat = ZonoramaProj(zCentreInit, A, zoom, L, H);

      // 2. Matrice DEM
      const demMat = CalcMatrixDEM(z0Mat, maxIter);

      // 3. Rendu visuel
      const imgData = distToImage(demMat, ctx);
      ctx.putImageData(imgData, 0, 0);
      console.timeEnd("Calcul Zoonorama");

      // 4. Lecture des paramètres
      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const px = Math.floor(e.clientX - rect.left);
        const py = Math.floor(e.clientY - rect.top);
        console.log("Test: " + px + " " + canvas.height);
        if (!(px >= 0 && px < canvas.width && py >= 0 && py < canvas.height)) {
          return;
        }
        const c = z0Mat[py][px];
        console.log(`re = ${c.re}, im=${c.im}`);
        const statusBar = document.getElementById("statusBar");
        if (statusBar) {
          statusBar.textContent = `c = ${c.re.toFixed(7)} ${c.im >= 0 ? "+" : ""}${c.im.toFixed(7)}i  |  P = (${Math.round(px)}, ${Math.round(py)})`;
        }
      });
    </script>
  </body>
</html>
