<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mandelbrot Orbit Analyzer POC</title>
    <style>
      body {
        font-family: monospace;
        background: #121212;
        color: #eee;
        text-align: center;
      }
      canvas {
        border: 1px solid #444;
        cursor: crosshair;
      }
    </style>
  </head>
  <body>
    <h2>Mandelbrot - Orbit Analyzer (POC Vanilla JS)</h2>
    <canvas id="canvas" width="600" height="600"></canvas>
    <div id="info">Survolez le canvas pour analyser l'orbite (c)</div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const info = document.getElementById("info");
      const width = canvas.width;
      const height = canvas.height;
      const maxIter = 100;

      // Repère complexe : x: [-2, 1], y: [-1.5, 1.5]
      const toComplex = (px, py) => ({
        x: -2 + (px / width) * 3,
        y: -1.5 + (py / height) * 3,
      });

      // Dessin de base de Mandelbrot
      function drawMandelbrot() {
        const imgData = ctx.createImageData(width, height);
        for (let py = 0; py < height; py++) {
          for (let px = 0; px < width; px++) {
            const c = toComplex(px, py);
            let zx = 0,
              zy = 0,
              i = 0;
            while (zx * zx + zy * zy < 4 && i < maxIter) {
              let tmp = zx * zx - zy * zy + c.x;
              zy = 2 * zx * zy + c.y;
              zx = tmp;
              i++;
            }
            const idx = (py * width + px) * 4;
            const val = i === maxIter ? 0 : (i * 12) % 255;
            imgData.data[idx] = val; // R
            imgData.data[idx + 1] = val / 2; // G
            imgData.data[idx + 2] = 255 - val; // B
            imgData.data[idx + 3] = 255; // Alpha
          }
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // Tracer l'orbite du point survolé
      canvas.addEventListener("mousemove", (e) => {
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const py = e.clientY - rect.top;
        const c = toComplex(px, py);

        drawMandelbrot(); // Redessine le fond

        // Tracé de l'orbite
        ctx.beginPath();
        ctx.strokeStyle = "#00ffcc";
        ctx.lineWidth = 1.5;

        let zx = 0,
          zy = 0,
          i = 0;
        let currPx = (zx - -2 / 3) * width;
        let currPy = (zy - -1.5 / 3) * height;
        ctx.moveTo(currPx, currPy);

        while (zx * zx + zy * zy < 4 && i < 50) {
          let tmp = zx * zx - zy * zy + c.x;
          zy = 2 * zx * zy + c.y;
          zx = tmp;

          let screenX = (zx - -2 / 3) * width;
          let screenY = (zy - -1.5 / 3) * height;
          ctx.lineTo(screenX, screenY);
          i++;
        }
        ctx.stroke();
        info.innerText = `c = ${c.x.toFixed(4)} + ${c.y.toFixed(4)}i | Itérations avant évasion: ${i}`;
      });

      drawMandelbrot();
    </script>
  </body>
</html>
