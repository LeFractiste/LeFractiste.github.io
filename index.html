<!doctype html>
<!-- Page d'édition de code SVG avec SVGgen de graphSVG.gs -->
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Générateur SVG</title>
    <script src="SVGgenerator.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 800px;
        margin: 20px auto;
        padding: 0 20px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
      }

      .input-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }

      input[type="text"] {
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        width: 200px;
      }

      button {
        padding: 6px 12px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ccc;
        background-color: #f0f0f0;
      }

      button:hover {
        background-color: #e0e0e0;
      }

      .btn-action {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
      }

      .btn-action:hover {
        background-color: #0056b3;
      }

      .btn-remove {
        color: red;
        border-color: #ffcccc;
        background-color: #fff0f0;
      }

      #svg-output {
        margin-top: 30px;
        padding: 20px;
        border: 1px dashed #ccc;
        min-height: 150px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <h2>Générateur de Graphique SVG</h2>

    <!-- 1. Liste de choix -->
    <div class="form-group">
      <label for="shape-select">Forme / Type :</label>
      <select id="shape-select">
        <option value="cycle" selected>cycle</option>
        <option value="tree">tree</option>
        <option value="star">star</option>
      </select>
    </div>

    <!-- 2. Conteneur des boîtes de texte -->
    <div class="form-group">
      <label>Arguments (mots) :</label>
      <div id="text-boxes-container">
        <!-- Les champs par défaut seront injectés par le script -->
      </div>
      <button type="button" onclick="addTextBox()">+ Ajouter un champ</button>
    </div>

    <!-- 3. Bouton de lancement -->
    <div class="form-group">
      <button type="button" class="btn-action" onclick="generateSVG()">
        Générer le SVG
      </button>
    </div>

    <hr />

    <!-- zone d'affichage du résultat -->
    <h3>Résultat :</h3>
    <div id="svg-output">Le SVG apparaîtra ici.</div>

    <script>
      // Mots par défaut au chargement
      const defaultWords = ["This", "is", "Fun"];

      // Initialisation des champs au chargement de la page
      window.addEventListener("DOMContentLoaded", () => {
        defaultWords.forEach((word) => addTextBox(word));
      });

      // Ajouter une boîte de texte
      function addTextBox(value = "") {
        const container = document.getElementById("text-boxes-container");

        const row = document.createElement("div");
        row.className = "input-row";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "arg-input";
        input.value = value;

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "btn-remove";
        removeBtn.textContent = "✕";
        removeBtn.onclick = () => row.remove();

        row.appendChild(input);
        row.appendChild(removeBtn);
        container.appendChild(row);
      }

      // Récupérer les valeurs et appeler SVGgen
      function generateSVG() {
        const shape = document.getElementById("shape-select").value;
        const inputs = document.querySelectorAll(".arg-input");

        // Extraction de toutes les valeurs saisies
        const args = Array.from(inputs).map((input) => input.value);

        // Vérification que la fonction externe existe bien
        if (typeof SVGgen === "function") {
          // SVGgen('cycle', 'This', 'is', 'Fun', ...)
          const svgResult = SVGgen(shape, ...args);
          displaySVG(svgResult);
        } else {
          alert("La fonction SVGgen() n'est pas définie dans ce contexte !");
        }
      }

      // Injection propre du SVG retourné
      function displaySVG(svgData) {
        const outputDiv = document.getElementById("svg-output");
        outputDiv.innerHTML = ""; // Nettoyage de la zone

        if (svgData instanceof Node) {
          // Si SVGgen renvoie un objet DOM (ex: Document, Element XML/SVG)
          outputDiv.appendChild(svgData);
        } else if (typeof svgData === "string") {
          // Si SVGgen renvoie une chaîne texte <svg>...</svg>
          outputDiv.innerHTML = svgData;
        } else {
          outputDiv.textContent = "Format de retour SVG inconnu.";
        }
      }

      /*

      Décommentez ce bloc si vous voulez tester la page sans votre vraie fonction SVGgen

      svg.appendChild(text);
      return svg;
    }
    */
    </script>
  </body>
</html>
