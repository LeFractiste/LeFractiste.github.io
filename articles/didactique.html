<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concepts / Le Fractiste</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #121214;
        color: #e1e1e6;
        padding: 2rem;
        max-width: 900px;
        margin: 0 auto;
      }
      h1 {
        color: #61afef;
        border-bottom: 1px solid #333;
        padding-bottom: 0.5rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 1.5rem;
        margin-top: 2rem;
      }
      .card {
        background: #1e1e24;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 1.5rem;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .card:hover {
        border-color: #61afef;
        transform: translateY(-2px);
      }
      .card h3 {
        margin-top: 0;
        color: #98c379;
      }
      .card p {
        font-size: 0.9rem;
        color: #abb2bf;
      }
      a {
        text-decoration: none;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <h1>Concepts liés à l'ensemble de Mandelbrot</h1>
    <p>
      En construction 
    </p>

    <div class="grid">
      <a href="../index.html" class="card">
        <h3>Retour</h3>
        <p>
          Retour à la page d'accueil du site Le Fractiste. 
        </p>
      </a>
  </body>
</html>
